# Publica la app en GitHub Pages (https://<usuario>.github.io/plant-care/).
# Antes, en el repositorio: Settings → Pages → Source: "GitHub Actions".
# Se lanza a mano desde la pestaña Actions → "Publicar en GitHub Pages" → Run workflow.
# Para publicar en cada cambio de main, añade `push: { branches: [main] }` en `on`.
name: Publicar en GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
