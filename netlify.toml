# Netlify: lo detecta solo al importar el repositorio.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El service worker no debe quedarse en caché del navegador, para que las
# actualizaciones de la app lleguen enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
